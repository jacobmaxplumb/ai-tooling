<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Tooling Chat</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --panel: #ffffff;
        --user: #2563eb;
        --assistant: #f3f4f6;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0f17;
          --panel: #121826;
          --user: #2563eb;
          --assistant: #1f2937;
          --text: #f9fafb;
          --muted: #9ca3af;
          --border: #1f2937;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--panel);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      header h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      header p {
        margin: 2px 0 0;
        font-size: 12px;
        color: var(--muted);
      }
      button.reset {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      button.reset:hover {
        color: var(--text);
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
      }
      .msg {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 14px;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--user);
        color: white;
        border-bottom-right-radius: 4px;
      }
      .msg.assistant {
        align-self: flex-start;
        background: var(--assistant);
        color: var(--text);
        border-bottom-left-radius: 4px;
      }
      .msg.thinking {
        align-self: flex-start;
        color: var(--muted);
        font-style: italic;
        background: transparent;
        padding-left: 4px;
      }
      footer {
        border-top: 1px solid var(--border);
        background: var(--panel);
        padding: 14px 20px;
      }
      form {
        display: flex;
        gap: 10px;
        max-width: 720px;
        width: 100%;
        margin: 0 auto;
      }
      input[type="text"] {
        flex: 1;
        padding: 10px 14px;
        border-radius: 22px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        outline: none;
      }
      input[type="text"]:focus {
        border-color: var(--user);
      }
      button.send {
        background: var(--user);
        color: white;
        border: 0;
        padding: 10px 18px;
        border-radius: 22px;
        font-weight: 600;
        cursor: pointer;
      }
      button.send:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>AI Tooling Chat</h1>
        <p>
          Try: <em>"Weather in Austin?"</em> ·
          <em>"Solve x² − 5x + 6 = 0"</em> ·
          <em>"Convert 100 USD to EUR"</em>
        </p>
      </div>
      <button class="reset" id="reset" type="button">Reset</button>
    </header>

    <main id="messages"></main>

    <footer>
      <form id="form">
        <input
          type="text"
          id="input"
          placeholder="Ask me something…"
          autocomplete="off"
          autofocus
        />
        <button class="send" type="submit">Send</button>
      </form>
    </footer>

    <script>
      const sessionId = crypto.randomUUID();
      const messagesEl = document.getElementById("messages");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const resetBtn = document.getElementById("reset");
      const sendBtn = form.querySelector("button.send");

      function addMessage(text, who) {
        const el = document.createElement("div");
        el.className = `msg ${who}`;
        el.textContent = text;
        messagesEl.appendChild(el);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return el;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        addMessage(text, "user");
        input.value = "";
        sendBtn.disabled = true;
        const thinking = addMessage("thinking…", "thinking");
        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sessionId, message: text }),
          });
          const data = await res.json();
          thinking.remove();
          if (!res.ok) {
            addMessage(`Error: ${data.error ?? res.statusText}`, "assistant");
          } else {
            addMessage(data.reply, "assistant");
          }
        } catch (err) {
          thinking.remove();
          addMessage(`Network error: ${err.message}`, "assistant");
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      });

      resetBtn.addEventListener("click", async () => {
        await fetch("/api/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId }),
        });
        messagesEl.innerHTML = "";
      });
    </script>
  </body>
</html>
